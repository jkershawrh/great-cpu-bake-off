version: 1
status: reviewed
source:
  name: cost-aware-inference-demo
  kind: repository
  location: ../cost-aware-inference-demo
  revision: e5abe14
  discovered_at: "2026-10-02"
  inspected_artifacts:
    - README.md
    - contracts/schemas/placement-evidence-v1.json
    - contracts/schemas/qualification-evidence-v1.json
    - deploy/openshift/resources.yaml
    - services/proof-api/app.py
    - services/proof-api/pipeline.py
    - services/proof-api/evaluation.py
    - services/proof-api/eval_cases.json
  discrepancies:
    - Culinary language is presentation framing; technical labels and evidence remain unchanged.
    - Quality is the deterministic score for the named checked-in case, not general model accuracy.
    - Cost is an execution-cost proxy derived from measured inference time and visible assumptions, not a supplier quote.
    - The current live environment is Intel Xeon plus Intel Gaudi 3; AMD and NVIDIA are separate future qualification environments.
intent:
  primary_user: Enterprise AI platform leaders, architects, application owners, and sales audiences
  workload: One selected industry case executed under CPU-only, accelerator-only, and heterogeneous policies
  recognized_problem: Teams compare isolated hardware throughput while agentic applications pay for accepted multi-step tasks.
  audience_decision: Decide which placement recipe meets the named-case quality threshold at acceptable latency and modeled cost.
  desired_outcome: Approve a workload-specific Red Hat AI proof instead of assigning every inference step to one compute tier.
architecture:
  actors:
    - {id: presenter, name: Presenter, kind: human, responsibility: Selects workload models and cost assumptions, status: verified, source: source repository src/scenes/BakeoffLive.tsx}
    - {id: workload-owner, name: Workload owner, kind: human, responsibility: Reviews evidence and owns acceptance, status: verified, source: services/proof-api/evaluation.py}
  runtime_objects:
    - {id: web, name: Bake Off presentation, kind: deployment, responsibility: Presents the journey and current-session evidence, status: verified, source: source repository src/App.tsx}
    - {id: proof-api, name: Cost-aware proof API, kind: deployment, responsibility: Executes isolated placement policies concurrently and retains provenance, status: verified, source: services/proof-api/app.py}
    - {id: semantic-router, name: vLLM Semantic Router, kind: deployment, responsibility: Classifies heterogeneous steps and selects the configured tier, status: verified, source: services/proof-api/pipeline.py}
    - {id: cpu-endpoint, name: Red Hat AI Inference CPU endpoint, kind: model-endpoint, responsibility: Serves the selected CPU model through the common contract, status: verified, source: services/proof-api/pipeline.py}
    - {id: accelerator-endpoint, name: Red Hat AI Inference accelerator endpoint, kind: model-endpoint, responsibility: Serves the selected accelerator model through the common contract, status: verified, source: services/proof-api/pipeline.py}
    - {id: mcp, name: Domain MCP tools, kind: mcp, responsibility: Supplies deterministic domain evidence, status: verified, source: services/proof-api/pipeline.py}
    - {id: evaluator, name: Deterministic evaluator, kind: policy, responsibility: Scores the named case against the visible threshold, status: verified, source: services/proof-api/evaluation.py}
    - {id: cost-model, name: Cost model, kind: policy, responsibility: Applies visible assumptions to measured execution time, status: verified, source: services/proof-api/evaluation.py}
  boundaries:
    - {id: namespace, name: OpenShift project boundary, kind: namespace, responsibility: Isolates the application and proof services, status: verified, source: deploy/openshift/resources.yaml}
    - {id: inference-contract, name: OpenAI-compatible inference boundary, kind: protocol, responsibility: Keeps application calls stable while placement changes, status: verified, source: services/proof-api/pipeline.py}
    - {id: acceptance, name: Acceptance boundary, kind: decision, responsibility: Prevents cost or speed from winning when quality fails, status: verified, source: services/proof-api/evaluation.py}
  external_dependencies: []
  flows:
    - id: competition-flow
      name: One workload through three placement recipes
      kind: request
      trigger: The presenter selects a vertical case CPU model accelerator model and assumptions.
      outcome: Three sourced outputs latencies scores routes and execution-cost proxies are returned together.
      edges:
        - {from: presenter, to: web, purpose: Select workload and assumptions, protocol: browser event, evidence_ids: [request-assumptions]}
        - {from: web, to: proof-api, purpose: Start three policies, protocol: HTTPS POST /proof/api/v1/bakeoff, evidence_ids: [bakeoff-response]}
        - {from: proof-api, to: semantic-router, purpose: Classify heterogeneous steps, protocol: HTTP POST /classify/batch, evidence_ids: [route-decisions]}
        - {from: proof-api, to: cpu-endpoint, purpose: Execute CPU-selected inference, protocol: OpenAI-compatible POST /v1/chat/completions, evidence_ids: [step-logs]}
        - {from: proof-api, to: accelerator-endpoint, purpose: Execute accelerator-selected inference, protocol: OpenAI-compatible POST /v1/chat/completions, evidence_ids: [step-logs]}
        - {from: proof-api, to: mcp, purpose: Collect domain evidence, protocol: MCP JSON-RPC tools/call, evidence_ids: [mcp-source]}
        - {from: proof-api, to: evaluator, purpose: Score the named case, protocol: in-process deterministic policy, evidence_ids: [eval-score]}
        - {from: proof-api, to: cost-model, purpose: Calculate the execution-cost proxy, protocol: in-process calculation, evidence_ids: [modeled-cost]}
        - {from: web, to: workload-owner, purpose: Present evidence for acceptance, protocol: visual review, evidence_ids: [bakeoff-response, eval-score, modeled-cost]}
operational_pattern:
  name: Order, prepare, place, judge, decide
  rationale: The same completed business task must survive a placement-policy change.
  steps:
    - {id: order, label: Frame the order, question: What constitutes one accepted completed task?, flow_ids: [competition-flow], evidence_ids: [eval-case]}
    - {id: prepare, label: Prepare the workflow, question: Which steps evidence and tools are required?, flow_ids: [competition-flow], evidence_ids: [eval-case, mcp-source]}
    - {id: place, label: Choose placement, question: Which tier executes each step without changing the app contract?, flow_ids: [competition-flow], evidence_ids: [route-decisions, step-logs]}
    - {id: judge, label: Judge the result, question: Did each policy preserve the required facts and evidence?, flow_ids: [competition-flow], evidence_ids: [eval-score]}
    - {id: decide, label: Select the recipe, question: Which passing policy best fits latency and cost constraints?, flow_ids: [competition-flow], evidence_ids: [eval-score, modeled-cost]}
  changed_condition: Toggle provisioned versus dedicated CPU cost and change hourly assumptions while preserving the workload and acceptance rule.
  close: Repeat the measured competition with the customer workload eval set traffic shape and target hardware.
evidence:
  - {id: eval-case, name: Versioned acceptance case, source: services/proof-api/eval_cases.json, collection: checked-in contract, supports: Defines required classification facts MCP evidence and summary concepts, status: verified}
  - {id: request-assumptions, name: Visible cost assumptions, source: bake-off request, collection: current-session request, supports: Makes modeled cost reproducible, status: verified}
  - {id: route-decisions, name: Per-step route decisions, source: semantic router response, collection: current-session response, supports: Shows selected tier method and confidence, status: verified}
  - {id: step-logs, name: Per-step prompts outputs and latency, source: model endpoint responses, collection: current-session response, supports: Shows model hardware route and measured execution, status: verified}
  - {id: mcp-source, name: Domain tool evidence, source: MCP gateway, collection: current-session response, supports: Distinguishes live evidence from rehearsal fallback, status: verified}
  - {id: eval-score, name: Named-case evaluation, source: deterministic evaluator, collection: current-session calculation, supports: Establishes pass or fail against the threshold, status: verified}
  - {id: modeled-cost, name: Execution-cost proxy, source: deterministic cost model, collection: current-session calculation, supports: Compares passing policies under visible assumptions, status: verified}
  - {id: bakeoff-response, name: Parallel policy response, source: POST /proof/api/v1/bakeoff, collection: current-session API response, supports: Preserves all three results together, status: verified}
decisions:
  - id: placement
    owner: Semantic router for heterogeneous execution and fixed policy for baseline lanes
    policy: Use the selected target per step and never silently substitute an unavailable accelerator lane.
    fail_closed_behavior: Mark the lane unavailable while preserving independent results.
    status: verified
  - id: workload-acceptance
    owner: Human workload owner
    policy: A less expensive or faster result cannot win unless it meets the named-case quality threshold.
    fail_closed_behavior: Display the failed score and withhold a preferred-policy recommendation.
    status: verified
ai_assessment:
  needed: true
  kind: mixed
  rationale: Generative models classify extract and summarize; embeddings classify placement; deterministic logic collects evidence and evaluates acceptance.
  tasks: [classification, entity extraction, professional summarization, route classification]
  inputs: [versioned case text, prior structured outputs, MCP evidence]
  outputs: [classification, entities, summary, route decision]
  model_identity_source: OpenAI-compatible response model field
  hardware_identity_source: Placement evidence returned by the deployed proof API
  evidence_access: [named case text, prior step outputs, domain MCP result]
  action_authority: none
  validation: [schema parsing, deterministic named-case evaluation, visible threshold, source-state labels]
  fallback: Checked-in responses are labeled REHEARSAL; an unavailable hardware lane remains unavailable.
  final_decision_owner: Human workload owner
story_mapping:
  audience_question: Which compute recipe completes this workload at acceptable quality latency and modeled cost?
  stakes:
    - One agent task repeats placement decisions across several inference calls.
    - Premium compute may be consumed by short structured work.
    - A cheaper result is irrelevant if it fails the workload acceptance rule.
  architecture_flow_ids: [competition-flow]
  live_proof_flow_ids: [competition-flow]
  comparison: CPU-only accelerator-only and heterogeneous policies using one case and one threshold.
  payoff: One application contract multiple Red Hat AI targets and a placement decision grounded in current-session evidence.
  next_journey: Run the competition with the customer workload models traffic and rates.
